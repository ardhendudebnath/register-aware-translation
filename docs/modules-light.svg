<polygon points="300.00,154.00 516.51,279.00 386.60,354.00 170.10,229.00" fill="#dfe6ff" stroke="#c9cfe0" stroke-width="1.2" stroke-linejoin="round" opacity="1.0"/>
<text x="343.30" y="250.50" font-size="12.5" fill="#1a1d28" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">pipeline/  —  orchestration</text>
