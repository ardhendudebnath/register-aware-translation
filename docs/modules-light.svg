<text x="304.33" y="170.00" font-size="12.5" fill="#1a1d28" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">app.py</text>
<text x="304.33" y="187.50" font-size="9.5" fill="#5f6780" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Flask · SocketIO · REST</text>
<rect x="640" y="120" width="320" height="66" rx="10" fill="#f0f2f8" stroke="#c9cfe0"/>
<text x="656.00" y="142.00" font-size="12.5" fill="#17835c" font-weight="700" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">evaluation/</text>
<text x="656.00" y="159.00" font-size="10.5" fill="#1a1d28" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">register · detection · semantic preservation</text>
<text x="656.00" y="174.00" font-size="10" fill="#5f6780" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">measures the layer, depends only on it</text>
<rect x="640" y="212" width="320" height="66" rx="10" fill="#f0f2f8" stroke="#c9cfe0"/>
<text x="656.00" y="234.00" font-size="12.5" fill="#5f6780" font-weight="700" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">classifier/</text>
<text x="656.00" y="251.00" font-size="10.5" fill="#1a1d28" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">fine-tunes on FAME-MT</text>
<text x="656.00" y="266.00" font-size="10" fill="#5f6780" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">optional — the engine works without it</text>
<rect x="640" y="304" width="320" height="66" rx="10" fill="#f0f2f8" stroke="#c9cfe0"/>
<text x="656.00" y="326.00" font-size="12.5" fill="#5f6780" font-weight="700" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">data_preprocessing/</text>
<text x="656.00" y="343.00" font-size="10.5" fill="#1a1d28" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">streams 11.2M rows into splits</text>
<text x="656.00" y="358.00" font-size="10" fill="#5f6780" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">hash-assigned, shuffled, interleaved</text>
<text x="34.00" y="534.00" font-size="12" fill="#5f6780" font-weight="500" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Nothing above the bottom slab can break it — which is why it still works with no network.</text>
</svg>