<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="The register ladder: one Bengali sentence rendered at four politeness levels">
<defs><marker id="arrowhead-light" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b93ab"/></marker><filter id="soft-light" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.16"/></filter></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="34" y="42" font-size="19" font-weight="700" fill="#1a1d28" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">One sentence, four registers</text>
<text x="34" y="65" font-size="13" fill="#5f6780" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Because the rule table is symmetric, the same data upgrades, downgrades and detects.</text>
<polygon points="47.81,371.00 150.00,430.00 150.00,448.00 47.81,389.00" fill="#c2cdf5" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="252.19,371.00 150.00,430.00 150.00,448.00 252.19,389.00" fill="#aebbef" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="150.00,312.00 252.19,371.00 150.00,430.00 47.81,371.00" fill="#dfe6ff" stroke="#c9cfe0" stroke-width="1.2" stroke-linejoin="round" opacity="1.0"/>
<text x="150.00" y="357.25" font-size="10.5" fill="#5f6780" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">CLOSE</text>
<text x="150.00" y="372.75" font-size="14" fill="#1a1d28" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">তুই কি করছিস?</text>
<text x="150.00" y="391.75" font-size="9" fill="#5f6780" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">to a younger sibling</text>
<polygon points="262.58,331.00 364.77,390.00 364.77,408.00 262.58,349.00" fill="#c2cdf5" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="466.97,331.00 364.77,390.00 364.77,408.00 466.97,349.00" fill="#aebbef" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="364.77,272.00 466.97,331.00 364.77,390.00 262.58,331.00" fill="#dfe6ff" stroke="#c9cfe0" stroke-width="1.2" stroke-linejoin="round" opacity="1.0"/>
<text x="364.77" y="317.25" font-size="10.5" fill="#5f6780" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">CASUAL</text>
<text x="364.77" y="332.75" font-size="14" fill="#1a1d28" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">তুমি কি করছ?</text>
<text x="364.77" y="351.75" font-size="9" fill="#5f6780" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">to a friend</text>
<polygon points="477.36,291.00 579.55,350.00 579.55,368.00 477.36,309.00" fill="#5f83f5" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="681.74,291.00 579.55,350.00 579.55,368.00 681.74,309.00" fill="#4a70ec" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="579.55,232.00 681.74,291.00 579.55,350.00 477.36,291.00" fill="#7c9cff" stroke="#c9cfe0" stroke-width="1.2" stroke-linejoin="round" opacity="1.0"/>
<text x="579.55" y="277.25" font-size="10.5" fill="#dbe3ff" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">POLITE</text>
<text x="579.55" y="292.75" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">আপনি কি করছেন?</text>
<text x="579.55" y="311.75" font-size="9" fill="#dbe3ff" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">to a stranger</text>
<polygon points="692.13,251.00 794.32,310.00 794.32,328.00 692.13,269.00" fill="#5f83f5" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="896.51,251.00 794.32,310.00 794.32,328.00 896.51,269.00" fill="#4a70ec" stroke="#c9cfe0" stroke-width="1.0" stroke-linejoin="round" opacity="1.0"/>
<polygon points="794.32,192.00 896.51,251.00 794.32,310.00 692.13,251.00" fill="#7c9cff" stroke="#c9cfe0" stroke-width="1.2" stroke-linejoin="round" opacity="1.0"/>
<text x="794.32" y="237.25" font-size="10.5" fill="#dbe3ff" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">FORMAL</text>
<text x="794.32" y="252.75" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">আপনি কি করছেন?</text>
<text x="794.32" y="271.75" font-size="9" fill="#dbe3ff" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">same form in Bengali</text>
<text x="34.00" y="462.00" font-size="11" fill="#5f6780" font-weight="700" text-anchor="start" letter-spacing="0.08em" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">ONE TABLE, THREE JOBS</text>
<rect x="34" y="476" width="296" height="42" rx="9" fill="#f0f2f8" stroke="#c9cfe0"/>
<text x="48.00" y="494.00" font-size="12.5" fill="#3d5bd9" font-weight="700" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">upgrade</text>
<text x="48.00" y="509.00" font-size="10.5" fill="#5f6780" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">casual → formal</text>
<rect x="346" y="476" width="296" height="42" rx="9" fill="#f0f2f8" stroke="#c9cfe0"/>
<text x="360.00" y="494.00" font-size="12.5" fill="#3d5bd9" font-weight="700" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">downgrade</text>
<text x="360.00" y="509.00" font-size="10.5" fill="#5f6780" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">formal → casual</text>
<rect x="658" y="476" width="296" height="42" rx="9" fill="#f0f2f8" stroke="#c9cfe0"/>
<text x="672.00" y="494.00" font-size="12.5" fill="#17835c" font-weight="700" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">detect</text>
<text x="672.00" y="509.00" font-size="10.5" fill="#5f6780" font-weight="400" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">read the speaker's own level</text>
<text x="34.00" y="538.00" font-size="12" fill="#5f6780" font-weight="500" text-anchor="start" letter-spacing="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">20 languages. Adding one means adding a table, not writing code — and every edit is shown to the user.</text>
</svg>